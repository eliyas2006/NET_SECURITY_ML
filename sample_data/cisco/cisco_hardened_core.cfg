! Synthetic / demonstration configuration - Cisco Hardened Core Router
! Authoritative Hardened Reference Baseline
version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname core-rtr-01.corp
!
boot-start-marker
boot-end-marker
!
security passwords min-length 14
!
aaa new-model
aaa authentication login default group radius local
aaa authorization exec default group radius local
!
ip domain-name corp.internal
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
ip http secure-server
!
no service finger
no ip source-route
no ip bootp server
no service tcp-small-servers
no service udp-small-servers
!
enable secret 9 $9$vD82kSldjf...KdLs92837492
username secadmin privilege 15 algorithm-type sha256 secret 8 $8$a1s2d3f4g5...JkL90
!
interface GigabitEthernet0/0/0
 description WAN-Uplink
 ip address 198.51.100.2 255.255.255.252
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
interface GigabitEthernet0/0/1
 description LAN-Internal
 ip address 10.100.1.1 255.255.255.0
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
!
ip access-list extended EDGE-FIREWALL-IN
 permit tcp 198.51.100.0 0.0.0.3 host 198.51.100.2 eq 22
 permit esp any host 198.51.100.2
 permit udp any host 198.51.100.2 eq 500
 permit udp any host 198.51.100.2 eq 4500
 deny ip any any log
!
logging buffered 64000 informational
logging host 10.100.50.10
logging trap notifications
!
ntp authenticate
ntp server 10.100.10.1
ntp server 10.100.10.2
!
snmp-server group SECGROUP v3 priv
snmp-server user snmpadmin SECGROUP v3 auth sha MyStr0ngAuthP@ss priv aes 128 MyStr0ngPr1vP@ss
!
banner motd ^C
===================================================================
PROPRIETARY SYSTEM - AUTHORIZED PERSONNEL ONLY.
ALL ACCESS AND COMMANDS ARE CONTINUOUSLY LOGGED AND MONITORED.
UNAUTHORIZED ACCESS WILL BE PROSECUTED UNDER CRIMINAL LAW.
===================================================================
^C
!
line con 0
 exec-timeout 10 0
 transport output telnet
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 transport output none
line vty 5 15
 exec-timeout 10 0
 transport input ssh
 transport output none
!
end
