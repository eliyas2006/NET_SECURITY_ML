# Synthetic / demonstration configuration - Fortinet FortiOS Hardened Edge Firewall
#config-version=FG100F-7.2.4-FW-build1390-230308:opmode=0:vdom=0:user=admin
#
config system global
    set hostname "fgt-edge-fw01"
    set admintimeout 10
    set admin-ssh-port 22
    set admin-https-redirect enable
    set pre-login-banner enable
    set post-login-banner enable
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.10 255.255.255.248
        set allowaccess ping https
        set type physical
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 10.200.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
end
config system password-policy
    set status enable
    set min-length 14
    set expire-status enable
end
config log syslogd setting
    set status enable
    set server "10.200.50.100"
    set mode udp
    set facility local7
end
config system ntp
    set ntpserver "time.cloudflare.com"
    set type custom
    set authentication enable
end
config system snmp user
    edit "snmpv3-nms"
        set status enable
        set security-level auth-priv
        set auth-proto sha256
        set priv-proto aes256
    next
end
config firewall policy
    edit 10
        set name "Outbound-Corp-Browsing"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "10.200.1.0/24"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "HTTP" "DNS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next
    edit 99
        set name "Default-Deny-Drop"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
end
