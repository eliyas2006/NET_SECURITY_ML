# Synthetic / demonstration configuration - Fortinet Permissive DMZ Firewall
#config-version=FG60E-6.4.2-FW-build1723-200720:opmode=0:vdom=0:user=admin
#
config system global
    set hostname "fgt-dmz-misconfigured"
    set admintimeout 0
end
config system interface
    edit "wan1"
        set ip 203.0.113.50 255.255.255.0
        set allowaccess ping telnet http
    next
    edit "internal"
        set ip 172.16.1.1 255.255.255.0
        set allowaccess ping http telnet
    next
end
config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end
config firewall policy
    edit 1
        set name "Allow-All-DMZ"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
end
end
